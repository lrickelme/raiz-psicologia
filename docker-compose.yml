services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: raiz
      POSTGRES_PASSWORD: raiz
      POSTGRES_DB: raiz
    ports:
      - "5433:5432"
    volumes:
      - raiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiz -d raiz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raiz_pgdata:
    name: raiz_pgdata
